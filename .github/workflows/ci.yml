name: release-verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Install locked Python dependencies
        run: uv sync --locked --extra test --group audit
      - name: Install locked extension dependencies
        run: npm ci --prefix extension
      - name: Test backend
        run: .venv\Scripts\python.exe -m pytest
      - name: Test and build extension UI
        run: npm run test:ui --prefix extension
      - name: Audit Python dependencies
        run: .venv\Scripts\python.exe scripts/audit_python_dependencies.py
      - name: Audit extension dependencies
        run: npm audit --prefix extension --audit-level=high
      - name: Validate vulnerability exceptions
        run: .venv\Scripts\python.exe scripts/check_vulnerability_exceptions.py
      - name: Generate CycloneDX SBOMs
        run: .venv\Scripts\python.exe scripts/generate_sbom.py
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom/*.cdx.json
