[project]
name = "clarith"
version = "0.2.0"
description = "Local clarithromycin interaction checker"
requires-python = ">=3.11"
dependencies = [
  "cryptography==49.0.0",
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "rapidfuzz==3.14.5",
  "starlette==1.3.1",
  "uvicorn==0.49.0",
]

[project.optional-dependencies]
test = [
  "httpx2==2.4.0",
  "pytest==9.0.3",
]

[dependency-groups]
audit = [
  "cyclonedx-bom==7.3.0",
  "pip-audit==2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
