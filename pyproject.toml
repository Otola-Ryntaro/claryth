[project]
name = "clarith"
version = "0.1.0"
description = "Local clarithromycin interaction checker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "rapidfuzz>=3.10,<4",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"
